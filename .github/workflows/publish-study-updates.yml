name: Publish Gospel Warrior study updates

on:
  # GitHub schedules can be delayed during busy periods. This checks hourly,
  # which is frequent enough for the Android reader without repeatedly polling
  # the public source from a hosted runner.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gospel-warrior-study-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the archive
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 "Pillow>=10,<13"

      - name: Import new public studies
        run: python gospel-warrior-study/updater.py --once

      - name: Create the static Android status document
        run: python gospel-warrior-study/publish_static_status.py

      - name: Validate the published archive
        run: python gospel-warrior-study/validate_archive.py

      - name: Publish changed archive files
        run: |
          git config user.name "gospel-warrior-updater[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gospel-warrior-study/content.json.gz \
            gospel-warrior-study/update-status.json \
            gospel-warrior-study/assets
          if git diff --cached --quiet; then
            echo "No archive changes to publish."
          else
            git commit -m "Update public study archive"
            git push
          fi
